<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QMA Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="navbar">
    <div class="logo">QMA Dashboard</div>
    <div>Welcome, User <span class="logout">Logout</span></div>
</div>

<div class="container">
    <h1>Quantity Conversion</h1>
    <p>Select a measurement type and enter values to instantly convert</p>

    <div class="categories">
        <div class="card active">Length</div>
        <div class="card">Weight</div>
        <div class="card">Volume</div>
        <div class="card">Temperature</div>
    </div>

    <div class="toggle">
        <button class="active">Convert</button>
        <button>Compare</button>
    </div>

    <div class="converter">
        <div class="box">
            <label>From</label>
            <input type="number" id="fromValue" value="1">
            <select id="fromUnit">
                <option value="meter">Meter</option>
                <option value="centimeter">Centimeter</option>
                <option value="kilometer">Kilometer</option>
            </select>
        </div>

        <div class="swap" onclick="swap()">⇄</div>

        <div class="box">
            <label>To</label>
            <input type="number" id="toValue" readonly>
            <select id="toUnit">
                <option value="centimeter">Centimeter</option>
                <option value="meter">Meter</option>
                <option value="kilometer">Kilometer</option>
            </select>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
